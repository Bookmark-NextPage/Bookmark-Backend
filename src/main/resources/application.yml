spring:
  application:
    name: Bookmark

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  ai:
    google:
      api-key: ${GEMINI_API_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000   # 1시간(ms)

file:
  dir: uploads/
  upload-dir: uploads/